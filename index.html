<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Les bundles JS/CSS sont hashés par Vite (toujours frais), mais ce
         fichier index.html porte un nom fixe : sans ces balises, GitHub
         Pages le sert avec un cache par défaut et un déploiement récent
         reste invisible sans hard-refresh. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Polski z Żubrem — apprendre le polonais</title>
    <!-- Chemins racine-relatifs : ces fichiers vivent dans public/, que Vite
         copie verbatim en préfixant le `base`. Sans le / initial, le build
         échouerait à les résoudre sur disque. -->
    <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- css/ n'est PAS dans public/ : Vite le bundle et le hache (cache-busting). -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Barre supérieure : marque, stats, objectif, réglages -->
    <header id="topbar"></header>
    <div class="xpbar"><div id="xpbar-fill" class="xpbar-fill"></div></div>

    <!-- Conteneur principal des écrans -->
    <main id="app" class="app"></main>

    <!-- Zones d'effets -->
    <div id="toast-host" class="toast-host"></div>
    <div id="fx-host" class="fx-host" aria-hidden="true"></div>

    <!-- Point d'entrée unique : l'ordre de dépendances n'est plus documentaire,
         il est porté et vérifié par le graphe d'imports ES. -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
