name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Le typage est une porte de REVUE, pas de livraison : il bloque la PR mais
      # n'est volontairement pas dans deploy.yml, et jamais une dépendance du
      # build (`noEmit`, aucun hook prebuild) — Vite efface les types sans les lire.
      - run: npm run typecheck
      - run: npm run build
